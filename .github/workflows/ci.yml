name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (CPU torch; enough to import train.py)
        run: |
          pip install numpy opencv-python-headless scikit-learn pyyaml pandas \
                      albumentations timm==1.0.27 \
                      torch --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple
      - name: Compile all sources
        run: python -m py_compile src/*.py docker/*.py
      - name: Unit tests
        run: |
          python tests/test_freuid_metric.py
          python tests/test_data.py
          python tests/test_resolve_args.py
