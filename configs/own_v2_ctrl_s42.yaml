# First own run = EVALUATION.md §2.4 control arm (docs/plans/2026-09-17-first-own-run-plan.md step 3).
# Launch (local layout): python src/train.py --config configs/own_v2_ctrl_s42.yaml
# On EC2 the repos sit side by side -> scripts/own_run_ec2.sh passes --split_dir explicitly.
# Smoke runs MUST override --tag (W&B run id = <tag>_dataset_final with resume=allow;
# a smoke under this tag would be silently resumed into by the real run).
split_dir: ../../id-fraud-detection/dataset_final   # v2; image paths resolve against its parent
epochs: 5            # winner trained 5, shipped ep2; §3.1 freezes the count after this run
bs: 6
accum: 4             # effective 24, the winner's allowance
eval_bs: 32          # eval-only (no_grad), plumbing; 8 -> 32 on 2026-09-22: eval is ~1/4 of an epoch
res: 448x728
aug: core
sbi: 0.0             # synthetic-fraud injection OFF (ARCHITECTURE.md open decision 5; ablation arm)
backbone: vit_large_patch14_reg4_dinov2
head_type: patch
lora_r: 16
select_on: genval    # gen-val source-macro; tie -> earliest (freeze_epoch.py, offline)
workers: 16          # plumbing: retune from the data-wait readout, never a recipe change
save_every: 250
wandb: true
wandb_project: freuid-own
seed: 42
tag: own_v2_ctrl_s42
# Speed knobs (PROFILING.md family 1), adopted per step 3c on 2026-09-22: ceiling script on the
# A10G 2026-09-19, plain 9.2 vs compiled+fused 12.4 img/s (+35 %, rule was >= 15 %;
# results/gpu_ceiling.csv). Precision stays fp16 (historical recipe; the bf16 rule is
# unmeasurable -- see the plan's 3c note).
compile: true
fused_opt: true
